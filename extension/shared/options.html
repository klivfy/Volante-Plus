<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Volante+ — Configurações</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>Volante+</h1>
    <p>
      Esta extensão só abre uma aba apontando para a sua instância do Volante+
      (hospedada por você ou de terceiros) — ela não empacota o app em si.
    </p>

    <label for="app-url">URL do Volante+</label>
    <input id="app-url" type="url" placeholder="https://volante-plus.example.com" />
    <button id="save" type="button">Salvar</button>
    <p id="feedback" class="feedback" role="status"></p>

    <script src="browser-api.js"></script>
    <script src="options.js"></script>
  </body>
</html>
