name: Gate de Calibração

# Fase 3 do Plano de Confiabilidade Estatística (docs/calibration-contract.md).
#
# Gate BLOQUEANTE do contrato de calibração: mede o falso-positivo real de
# todos os métodos `monte-carlo` do catálogo — incluindo o walk-forward,
# custoso por histórico — sobre N = 2.000 históricos honestos e reprova a
# execução se o limite superior do IC de Wilson 95% de qualquer método
# ultrapassar alfa + 2 p.p. O comando é o mesmo da Fase 2
# (`npm run audit` -> scripts/audit-report.mjs): código de saída 0 = dentro
# do contrato, 1 = CONTRATO VIOLADO, 2 = erro de ambiente.
#
# Sem `concurrency` de propósito: um gate em andamento nunca deve ser
# cancelado no meio — a evidência semanal (JSON + PDF) importa mais do que
# economizar minutos, e o gatilho é semanal, não por PR.

on:
  schedule:
    # Segundas-feiras, 03:00 UTC (00:00 em São Paulo). Nota do GitHub:
    # schedules só disparam depois que esta branch chega à default (main).
    - cron: "0 3 * * 1"
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    working-directory: web

permissions:
  contents: read

jobs:
  gate:
    name: Gate do contrato (N = 2.000)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala dependências
        run: npm ci

      # Bloqueante: qualquer veredito FAIL do catálogo reprova o job.
      - name: Gate do contrato de calibração (N = 2.000, alfa + 2 p.p.)
        run: npm run audit

      # Mesmo com o gate vermelho, a evidência precisa sobrar para
      # reprodução e diagnóstico (JSON com commit/seeds/hashes + PDF).
      - name: Publica relatórios de auditoria (JSON + PDF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: audit-reports/
          retention-days: 90
