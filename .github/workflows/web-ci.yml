name: Web CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

permissions:
  contents: read

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Instala dependências da extensão
        working-directory: extension
        run: npm ci

      - name: Instala dependências do popup da extensão
        working-directory: extension/popup-app
        run: npm ci

      - name: Empacota extensões (Chrome/Edge/Firefox)
        working-directory: extension
        run: node build.mjs

      - name: Publica build web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/.next
          retention-days: 3

      - name: Publica extensões
        uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: |
            extension/dist/chrome.zip
            extension/dist/edge.zip
            extension/dist/firefox.zip
          retention-days: 7

  e2e:
    name: Testes e2e (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Opcional/best-effort: uma falha aqui não bloqueia o job de build acima.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Instala navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build de produção
        run: npm run build

      # O `a11y.spec.ts` roda no job próprio abaixo, que bloqueia o merge.
      - name: Testes e2e
        run: npx playwright test flow offline

      - name: Relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  a11y:
    name: Acessibilidade (axe, texto a 200%, 320 px)
    # Independente do job de build: as guardas de acessibilidade não podem
    # ficar puladas quando outro passo do build falha. Sem `continue-on-error`:
    # uma regressão aqui bloqueia o merge. Ver docs/revisao-de-design-2026-10.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Instala navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build de produção
        run: npm run build

      - name: Guardas de acessibilidade
        run: npx playwright test a11y

      # Retenção curta e sem bloquear: a cota de artefatos é compartilhada
      # entre todos os workflows (ver a Constituição, "CI e operação").
      - name: Relatório do Playwright (em caso de falha)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: web/playwright-report/
          retention-days: 3

  deploy:
    name: Deploy (Vercel)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub rejeita `secrets` usado direto em `if:` (falha de validação do
    # workflow inteiro, antes de qualquer job rodar — "Unrecognized
    # named-value: 'secrets'"). Por isso o valor passa por uma env de job
    # primeiro; os `if:` dos passos abaixo leem `env`, não `secrets`.
    env:
      VERCEL_CONFIGURED: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
      DEPLOY_NOTIFY_CONFIGURED: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Só roda se os três secrets da Vercel estiverem configurados no
      # repositório (Settings → Secrets and variables → Actions). Sem eles,
      # o passo é pulado e o workflow continua verde — deploy é opcional.
      - name: Deploy para produção
        if: env.VERCEL_CONFIGURED == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: web
          vercel-args: "--prod"

      - name: Deploy pulado (secrets da Vercel não configurados)
        if: env.VERCEL_CONFIGURED != 'true'
        run: echo "VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID não configurados nos secrets do repositório — deploy pulado. Ver docs/WEB.md#deploy."

      # Notificação opcional: qualquer endpoint que aceite um POST JSON
      # (webhook do Slack/Discord, ou algo próprio). Sem o secret
      # configurado, o passo é pulado silenciosamente.
      - name: Notifica nova versão deployada
        if: env.VERCEL_CONFIGURED == 'true' && env.DEPLOY_NOTIFY_CONFIGURED == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"text":"Volante+ web: novo deploy em produção (commit %s). %s"}' "$COMMIT" "$RUN_URL")"
