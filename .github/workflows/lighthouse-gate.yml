name: lighthouse-gate

# P5 do roadmap de PERF/a11y (docs/PROPOSTAS-PERF-A11Y.md, seção 6).
#
# Budgets calibrados a partir das medianas medidas no sandbox de auditoria
# (docs/PROPOSTAS-PERF-A11Y.md §6.1): LCP 2,4–3,2 s e TBT 1,0–4,9 s têm
# variância alta no sandbox; em runner dedicado os números tendem a ser
# melhores — ajustar para baixo depois da primeira execução real.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção (webpack — exigência do next-pwa/Workbox)
        run: npx next build --webpack

      - name: Gate Lighthouse nas 4 rotas (3 runs cada, mediana)
        run: |
          cat > lighthouserc.json <<'EOF'
          {
            "ci": {
              "collect": {
                "startServerCommand": "npx next start -p 3000",
                "startServerReadyPattern": "Ready",
                "url": [
                  "http://localhost:3000/",
                  "http://localhost:3000/backtesting",
                  "http://localhost:3000/analise-avancada",
                  "http://localhost:3000/sobre"
                ],
                "numberOfRuns": 3
              },
              "assert": {
                "assertions": {
                  "categories:accessibility": ["error", { "minScore": 1 }],
                  "categories:best-practices": ["error", { "minScore": 0.95 }],
                  "categories:performance": ["warn", { "minScore": 0.7 }],
                  "largest-contentful-paint": ["error", { "maxNumericValue": 3000 }],
                  "total-blocking-time": ["warn", { "maxNumericValue": 2500 }],
                  "errors-in-console": "off"
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF
          npx --yes @lhci/cli@0.14 autorun

      # NOTAS sobre os budgets:
      # - Acessibilidade é erro HARD = 1.0: o app está em 100 nas 4 rotas
      #   e qualquer regressão semântica (heading, contraste, aria) deve
      #   quebrar o CI.
      # - Performance entra como WARN (minScore 0.7): no sandbox medimos
      #   mediana 67; em runner deve ficar acima, mas variância de TBT em
      #   CPU compartilhada torna o score um indicador de tendência, não de
      #   corte. Promover a "error" após estabilizar os números do runner.
      # - errors-in-console desligado: o Chromium estoura
      #   ERR_INSUFFICIENT_RESOURCES sob throttle em runners pequenos
      #   (artefato documentado na seção 6.1), não é defeito do app.
