name: Android APK Build

# Convenção de tags: cada artefato tem um workflow dono, para que uma tag
# nunca dispare três releases concorrentes (ver extension-release.yml).
#   - `v<numero>-android`    → aqui (APK release assinado)
#   - `v<numero>`            → release.yml (APK debug)
#   - `v<numero>-desktop`    → desktop-ci.yml
#   - `web-v<numero>`        → extension-release.yml
# Antes o gatilho era `v2.1*` (versão hardcoded) mais uma branch temporária.
on:
  push:
    tags:
      - 'v*-android'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # JDK 17 para bater com android-ci.yml, release.yml e desktop-ci.yml —
      # o projeto compila com Java 17 (ver app/build.gradle.kts).
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # A versão publicada sai do versionName declarado no build, não de um
      # literal no workflow: hardcodar "2.1.0" aqui deixava artefato e notas
      # mentindo a cada bump de versão.
      - name: Resolve a versão do app
        id: appversion
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$version" ]; then
            echo "::error::versionName não encontrado em app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "versionName: $version"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: '-Xmx2048m'

      # WHY dinâmico: o nome do APK depende de haver signingConfig ou não
      # (app-release.apk vs app-release-unsigned.apk — ver app/build.gradle.kts).
      # Hardcodar "app-release.apk" aqui já causou um bug real: o passo de
      # upload silenciosamente não encontrava o arquivo e não subia artefato
      # nenhum, sem que o job aparecesse como falho.
      - name: Localizar APK gerado
        id: locate
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ Nenhum APK encontrado em app/build/outputs/apk/release"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "✅ APK: $APK"

      - name: Verify APK structure
        run: |
          APK="${{ steps.locate.outputs.path }}"
          echo "📦 APK Contents:"
          unzip -l "$APK" | grep -E "(AndroidManifest|classes\.dex|resources\.arsc|META-INF/MANIFEST)" | head -10

          echo ""
          echo "📋 Manifest info:"
          aapt2 dump badging "$APK" 2>/dev/null | head -20 || unzip -p "$APK" AndroidManifest.xml | head -20

      # WHY sem mascarar o código de saída: a versão anterior fazia
      # `jarsigner -verify ... | head -20`, e o exit code do pipe é o do
      # `head` (sempre 0), não o do `jarsigner` — então um APK sem
      # assinatura ("jar is unsigned.") passava como sucesso silenciosamente.
      # Aqui o resultado vira output explícito para os passos seguintes
      # decidirem o que fazer, em vez de reportar sucesso incondicional.
      - name: Verify APK signature
        id: sign
        run: |
          set -euo pipefail
          APK="${{ steps.locate.outputs.path }}"
          echo "🔐 Verificando assinatura do APK..."
          if output=$(jarsigner -verify -verbose -certs "$APK" 2>&1); then
            echo "$output" | head -20
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✅ APK assinado e verificado."
          else
            echo "$output" | head -20
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  APK SEM ASSINATURA — o Android recusa instalar assim."
            echo "⚠️  Configure keystore.properties ou os secrets VOLANTEPLUS_STORE_FILE/"
            echo "⚠️  STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD para gerar um release assinado"
            echo "⚠️  (ver app/build.gradle.kts). Sem isso, use o workflow Release (assembleDebug)."
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: volante-plus-v${{ steps.appversion.outputs.version }}-${{ steps.sign.outputs.signed == 'true' && 'release' || 'release-UNSIGNED' }}
          path: ${{ steps.locate.outputs.path }}
          retention-days: 7

      # WHY `gh release` em vez de softprops/action-gh-release@v1: mesma
      # razão de extension-release.yml — a v1 roda em runtime Node antigo e o
      # repositório já usa o gh CLI em release.yml e desktop-ci.yml.
      - name: Create Release (on tag push)
        if: github.ref_type == 'tag' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.locate.outputs.path }}
          VERSION: ${{ steps.appversion.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # Volante+ v${VERSION} Android Release

          APK de release **assinado**, gerado por \`android-build.yml\`.

          **Build Info**:
          - versionName: ${VERSION}
          - minSdkVersion: 26 (Android 8.0)
          - targetSdkVersion: 35 (Android 15)
          - Commit: \`${{ github.sha }}\`

          **Installation**:
          \`\`\`bash
          adb install $(basename "$APK")
          \`\`\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" \
              --target "${{ github.sha }}" \
              --title "Volante+ Android v${VERSION}" \
              --notes-file release-notes.md \
              --draft
          fi

      - name: Aviso de release sem assinatura (on tag push)
        if: github.ref_type == 'tag' && steps.sign.outputs.signed != 'true'
        run: |
          echo "⚠️  Tag $GITHUB_REF publicada, mas o APK não está assinado —"
          echo "⚠️  a GitHub Release NÃO foi criada. Configure o keystore de release"
          echo "⚠️  (secrets VOLANTEPLUS_STORE_FILE/STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD)"
          echo "⚠️  e reexecute este workflow, ou use o workflow Release (assembleDebug)."

      - name: Build failed notification
        if: failure()
        run: |
          echo "❌ Build failed. Check logs above for details."
          echo ""
          echo "Common issues:"
          echo "1. Network issues - retry the workflow"
          echo "2. Gradle cache issues - clear cache and retry"
          echo "3. Java version mismatch - verify Java 17 is used"
          exit 1
