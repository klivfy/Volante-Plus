name: Release

# Publica o APK como Release do GitHub (download público e permanente),
# ao contrário do artefato do CI, que expira em 14 dias e exige login.
#
# Dois gatilhos:
#   1. push de tag `v<numero>` — o caminho normal;
#   2. workflow_dispatch       — republica uma tag existente.
#
# As tags com sufixo têm outro dono e são excluídas aqui para que uma mesma
# tag não gere duas Releases: `v*-android` (android-build.yml), `v*-desktop`
# (desktop-ci.yml) e `web-v*` (extension-release.yml). O antigo gatilho de
# branch com `[release]` na mensagem do commit foi removido: publicava uma
# Release pública a partir de qualquer push cuja mensagem contivesse a
# palavra.
on:
  push:
    tags:
      - "v*"
      - "!v*-android"
      - "!v*-desktop"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar (ex.: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: APK e Release
    # `[web-only]` no commit da tag pula a Release Android — usado quando a
    # tag `v*` marca um lançamento da plataforma web/PWA sem mudança de
    # código Android (ex.: v2.0.0). workflow_dispatch ignora esse marcador
    # de propósito: é sempre um pedido explícito de publicar uma tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' && !contains(github.event.head_commit.message, '[web-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve o ref a compilar
        id: source
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Só há dois gatilhos: tag ou workflow_dispatch com a tag a republicar.
          if [ -n "${INPUT_TAG:-}" ]; then
            echo "ref=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Resolve a tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publicando como ${tag}"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew :app:testDebugUnitTest

      # Build de debug, não de release: o buildType `release` não tem
      # signingConfig, então `assembleRelease` produz um APK sem assinatura,
      # que o Android recusa instalar. Para publicar um APK de release é
      # preciso cadastrar um keystore nos secrets do repositório e criar o
      # signingConfig correspondente em app/build.gradle.kts.
      - name: Build do APK
        run: ./gradlew :app:assembleDebug

      - name: Prepara o pacote
        id: package
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/volante-plus-${TAG}.apk"
          echo "sha256=$(sha256sum "dist/volante-plus-${TAG}.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "dist/volante-plus-${TAG}.apk" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Notas da release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          SIZE: ${{ steps.package.outputs.size }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## Volante+ ${TAG}

          | | |
          |---|---|
          | Commit | \`${COMMIT}\` |
          | Arquivo | \`volante-plus-${TAG}.apk\` (${SIZE}) |
          | SHA-256 | \`${SHA256}\` |

          ### Instalação

          Baixe o APK e instale no aparelho (é preciso permitir a instalação de
          fontes desconhecidas). Requer Android 8.0 (API 26) ou superior.

          ### Aviso

          Este APK usa a **assinatura de debug** do Android SDK, porque o
          repositório ainda não tem um keystore de release configurado. Serve
          para testes e distribuição interna, mas não pode ser publicado na
          Play Store nem atualizar uma instalação assinada com outra chave.
          EOF

      # Idempotente: reexecutar o workflow atualiza a Release em vez de falhar.
      - name: Publica a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          apk="dist/volante-plus-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
            gh release edit "$TAG" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" "$apk" \
              --target "${{ github.sha }}" \
              --title "Volante+ $TAG" \
              --notes-file release-notes.md \
              --prerelease
          fi
