name: Extension Release Build

# Convenção de tags (ver specs/002, T076): a extensão acompanha o release
# web, então dispara apenas em `web-vX.Y.Z`. As demais tags têm dono único:
#   - `v<numero>`            → release.yml (APK debug Android)
#   - `v<numero>-android`    → android-build.yml (APK release assinado)
#   - `v<numero>-desktop`    → desktop-ci.yml (instaladores Windows)
# Antes, os três workflows respondiam a `v*` e colidiam na mesma tag.
on:
  push:
    tags:
      - 'web-v*'

permissions:
  contents: write

jobs:
  build-extensions:
    runs-on: ubuntu-latest
    name: Build browser extensions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve versão da tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#web-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      # Portão anti-dessincronização: se o bump de versão do web não tiver
      # atualizado os manifests da extensão, o release para aqui — sem gerar
      # zips rotulados com a versão errada.
      - name: Confere versão dos manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/sync-extension-versions.mjs --check "$VERSION"

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Install popup-app dependencies
        working-directory: extension/popup-app
        run: npm ci

      - name: Build all extensions (Chrome, Edge, Firefox)
        working-directory: extension
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f extension/dist/chrome.zip || (echo "Chrome zip not found" && exit 1)
          test -f extension/dist/edge.zip || (echo "Edge zip not found" && exit 1)
          test -f extension/dist/firefox.zip || (echo "Firefox zip not found" && exit 1)
          echo "✓ All extension packages built successfully"

      # WHY `gh release` em vez de actions/create-release@v1 e
      # actions/upload-release-asset@v1: essas actions rodam em runtimes Node
      # antigos e sem manutenção. O padrão aqui é o mesmo já usado em
      # release.yml e desktop-ci.yml.
      - name: Create Release Draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          **Version $VERSION**

          This is an automated release build for the browser extensions.

          ## Artifacts

          - **Chrome** (\`volante-plus-chrome-$VERSION.zip\`) — For Chrome Web Store
          - **Edge** (\`volante-plus-edge-$VERSION.zip\`) — For Microsoft Edge Add-ons
          - **Firefox** (\`volante-plus-firefox-$VERSION.zip\`) — For Firefox Add-ons

          ## Next steps

          1. ✅ **Review** this release and the build artifacts
          2. 📝 **Update** release notes and changelog (if needed)
          3. 🚀 **Publish** to each store:
             - [Chrome Web Store](https://chrome.google.com/webstore/devconsole)
             - [Microsoft Edge Add-ons](https://partner.microsoft.com/dashboard/microsoftedge/overview)
             - [Firefox Add-ons](https://addons.mozilla.org/developers/)

          See [\`docs/EXTENSION-RELEASES.md\`](https://github.com/${{ github.repository }}/blob/main/docs/EXTENSION-RELEASES.md) for detailed publishing instructions.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::Release $GITHUB_REF_NAME já existe — artefatos serão reenviados."
          else
            gh release create "$GITHUB_REF_NAME" \
              --target "${{ github.sha }}" \
              --title "Volante+ Extensão $VERSION" \
              --notes-file release-notes.md \
              --draft
          fi

      - name: Upload Chrome extension
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="volante-plus-chrome-${VERSION}.zip"
          cp extension/dist/chrome.zip "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

      - name: Upload Edge extension
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="volante-plus-edge-${VERSION}.zip"
          cp extension/dist/edge.zip "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

      - name: Upload Firefox extension
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="volante-plus-firefox-${VERSION}.zip"
          cp extension/dist/firefox.zip "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

      - name: Post success summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Extension Release Build Successful

          | Component | Status |
          |-----------|--------|
          | Chrome | ✅ Built |
          | Edge | ✅ Built |
          | Firefox | ✅ Built |

          ### Next steps

          The release draft has been created. [Review and publish here](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}).
          EOF
