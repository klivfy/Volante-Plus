org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# O projeto usa KSP (para o Room), que ainda não suporta o Kotlin embutido
# introduzido no AGP 9. Mantemos o plugin org.jetbrains.kotlin.android
# explícito em vez do built-in Kotlin até o KSP anunciar suporte.
# android.newDsl=false também é necessário: o plugin kotlin-android legado
# faz cast para o antigo BaseExtension, removido pelo novo DSL do AGP 9.
# Ambas as flags são escape hatches temporários (removidos no AGP 10).
android.builtInKotlin=false
android.newDsl=false
